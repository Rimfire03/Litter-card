name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build dist
        run: |
          npm run build

      - name: Create Release Zip
        run: |
          cd dist
          zip -r litter-card.zip .

      - name: Determine Prerelease
        id: check_prerelease
        run: |
          if [[ "${{ github.ref_name }}" == *"-dev"* || "${{ github.ref_name }}" == *"-beta"* || "${{ github.ref_name }}" == *"-rc"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate Changelog / Release Notes
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"* %s (%h)" "$PREV_TAG..${{ github.ref_name }}")
          else
            CHANGELOG=$(git log --pretty=format:"* %s (%h)" -n 10 "${{ github.ref_name }}")
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "$CHANGELOG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Upload binaries and release notes to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ github.ref_name }}
          body: |
            ### 🐱 Changes in ${{ github.ref_name }}
            
            ${{ env.CHANGELOG }}
          generate_release_notes: true
          prerelease: ${{ steps.check_prerelease.outputs.is_prerelease }}
          files: |
            dist/litter-card.js
            dist/litiere.png
            dist/litter-card.zip
